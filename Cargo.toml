[package]
name = "wist-ingest-ctrl"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Control plane for the wist-ingest data plane (warp-parse TCP+TLS source)"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "time",
    "fs",
] }
tokio-rustls = "0.26"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
# 配置里的 `${SEC_...}` 变量解析（与 wist-center / wist-gateway 同口径）：
# orion-sec 读 `INGEST_CTRL_SEC_FILE` 指向的密钥文件（`.wist/sec-value.yml`），
# orion-variate 提供 `EnvDict` / `EnvEvaluable` / `EnvChecker`。
orion-sec = "0.7"
orion-variate = "0.14"
# 共享原语：都按版本引（CI 发版，见各仓 release.yml）。
# 本地联调可改成 path（与它们平铺在同一父目录时）。
# `credential` = 验证侧登记表（摘要比对 / 裁剪 / 验签）；与 `wist-cred-peer` 同一口径。
wist-auth = { version = "0.3", features = ["serde", "axum", "credential"] }
wist-pki = "0.1.2"
# 访问凭据（`wist-cred` 的验证方 X）：收 register/revoke、自己的摘要表、验 `wcr_…` 令牌。
# 本服务**不再自己实现**这套（旧 `src/credentials.rs` 的推送路由 / 摘要表已删）。
wist-cred-peer = "0.5"

[dev-dependencies]
http-body-util = "0.1"
