name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 按平台原生编译二进制，产出 tarball（直接下载 + 供 Docker 镜像用）
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-ingest-ctrl" artifacts/wist-ingest-ctrl
          cp version.txt artifacts/version.txt
          cp systemd/wist-ingest-ctrl.service artifacts/wist-ingest-ctrl.service
          tar -czf "wist-ingest-ctrl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C artifacts wist-ingest-ctrl wist-ingest-ctrl.service version.txt

      - uses: actions/upload-artifact@v7
        with:
          name: wist-ingest-ctrl-${{ matrix.target }}
          path: wist-ingest-ctrl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2. 多架构镜像：ghcr.io + 腾讯云 TCR（国内服务器拉 ghcr 很慢）
  #
  # 与 wist-center 同构：每个架构在**原生 runner** 上单独构建并 push-by-digest
  # （amd64 → ubuntu-24.04，arm64 → ubuntu-24.04-arm），最后由 docker-manifest
  # 用 `imagetools create` 合成多架构 tag。
  #
  # 不要改回单个 job + `platforms: linux/amd64,linux/arm64`：那会让 arm64 走 QEMU，
  # 且 multi-arch 的 push 阶段实测会挂住十几分钟。
  docker-amd64:
    name: Docker image (linux/amd64)
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-ingest-ctrl-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Stage binary for docker build
        run: |
          mkdir -p dist/amd64
          tar -xzf "artifacts/wist-ingest-ctrl-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" \
            -C dist/amd64
          ls -l dist/amd64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ctrl-amd64
          cache-to: type=gha,mode=max,scope=ctrl-amd64

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          [ -n "${digest}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-arm64:
    name: Docker image (linux/arm64)
    needs: [build-binaries]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wist-ingest-ctrl-aarch64-unknown-linux-gnu
          path: artifacts

      - name: Stage binary for docker build
        run: |
          mkdir -p dist/arm64
          tar -xzf "artifacts/wist-ingest-ctrl-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz" \
            -C dist/arm64
          ls -l dist/arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ctrl-arm64
          cache-to: type=gha,mode=max,scope=ctrl-arm64

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          [ -n "${digest}" ] || { echo "::error::build-push 没有返回 digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Compose multi-arch manifest
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to TCR
        uses: docker/login-action@v4
        with:
          registry: dy-sec.tencentcloudcr.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag（v0.1.1-alpha 等）只推该 tag，不覆盖 :latest。
          ghcr="ghcr.io/${{ github.repository }}"
          tcr="dy-sec.tencentcloudcr.com/cloud/wist-ingest-ctrl"
          ref="${{ github.ref_name }}"
          # 一行一个 tag。不要写成 `printf '%s\n%s' a b c`：参数多于格式里的占位符时，
          # 第二轮从 `%s` 开始续写，会把最后两行粘成一个（`...:latest...:latest`）。
          tags_file="${RUNNER_TEMP}/image-tags.txt"
          printf '%s\n' "$ghcr:$ref" "$tcr:$ref" > "$tags_file"
          case "$ref" in
            *-*) ;;
            *) printf '%s\n' "$ghcr:latest" "$tcr:latest" >> "$tags_file" ;;
          esac
          {
            echo "tags<<__EOF__"
            cat "$tags_file"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digests=()
          for f in /tmp/digests/*; do
            digests+=("ghcr.io/${{ github.repository }}@sha256:$(basename "$f")")
          done
          [ "${#digests[@]}" -eq 2 ] || { echo "::error::期望 2 个架构 digest，实际 ${#digests[@]}"; exit 1; }
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"

  # 3. 发布 tarball 到 GitHub Release
  release:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-ingest-ctrl-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
